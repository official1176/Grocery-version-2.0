  async function saveEditedBill(e){e.preventDefault();if(!editingSaleId||!editingOriginal)return;const form=new FormData(e.currentTarget),cashier=String(form.get('cashier')||'').trim(),customerName=String(form.get('customerName')||'').trim(),customerPhone=String(form.get('customerPhone')||'').trim(),shop={...settings,gstType:form.get('gstType')==='inter'?'inter':'intra'},breakdown=calculateGst(cart,shop),received=receivedAmount(editingOriginal),createdAt=new Date().toISOString();if(!cashier){toast('Enter the cashier name.',true);return}if(!cart.length){toast('An invoice must contain at least one item.',true);return}if(breakdown.total+0.001<received){toast('The new bill total cannot be less than payments already received.',true);return}const tx=db.transaction(['products','sales','movements'],'readwrite'),productStore=tx.objectStore('products'),saleStore=tx.objectStore('sales'),movementStore=tx.objectStore('movements'),productReq=productStore.getAll(),saleReq=saleStore.get(editingSaleId);let productsReady=false,saleReady=false,productList=[],liveSale=null,failure='',updated=null,finished=false;const abort=message=>{if(finished)return;finished=true;failure=message;try{tx.abort()}catch{}};const apply=()=>{if(!productsReady||!saleReady||finished)return;if(!liveSale){abort('This invoice could not be found. Refresh the page and try again.');return}const oldQty=new Map(),newQty=new Map();(liveSale.items||[]).forEach(it=>oldQty.set(it.id,(oldQty.get(it.id)||0)+Number(it.quantity||0)));cart.forEach(it=>newQty.set(it.id,(newQty.get(it.id)||0)+Number(it.quantity||0)));for(const productId of new Set([...oldQty.keys(),...newQty.keys()])){const delta=roundMoney((newQty.get(productId)||0)-(oldQty.get(productId)||0));if(!delta)continue;const product=productList.find(p=>p.id===productId);if(!product){abort(`Stock record for ${cart.find(it=>it.id===productId)?.name||productId} is missing. No changes were saved.`);return}const nextStock=roundMoney(Number(product.stock||0)-delta);if(nextStock< -0.0001){abort(`Only ${Number(product.stock||0)} ${product.unit||'unit'} of ${product.name} remain. Reduce the revised quantity.`);return}product.stock=Math.max(0,nextStock);product.updatedAt=createdAt;productStore.put(product);movementStore.add({id:id(),productId:product.id,name:product.name,type:'sale-edit',quantity:roundMoney(-delta),createdAt,note:`${liveSale.invoice} edited`})}updated={...liveSale,customerName,customerPhone,cashier,items:breakdown.lines,subtotal:breakdown.taxableSubtotal,grossSubtotal:breakdown.grossSubtotal,tax:breakdown.tax,total:breakdown.total,gstSummary:{taxableSubtotal:breakdown.taxableSubtotal,tax:breakdown.tax,cgst:breakdown.cgst,sgst:breakdown.sgst,igst:breakdown.igst,byRate:breakdown.byRate},shop,receivedAmount:received,balanceDue:roundMoney(Math.max(0,breakdown.total-received)),payment:paymentLabel(liveSale),editedAt:createdAt,editCount:Number(liveSale.editCount||0)+1};saleStore.put(updated);finished=true};productReq.onsuccess=()=>{productList=productReq.result;productsReady=true;apply()};saleReq.onsuccess=()=>{liveSale=saleReq.result||null;saleReady=true;apply()};productReq.onerror=()=>abort('Could not read current stock. No changes were saved.');saleReq.onerror=()=>abort('Could not read the saved invoice. No changes were saved.');tx.oncomplete=async()=>{if(!updated)return;cart=[];editingSaleId=null;editingOriginal=null;settings=settingsBeforeBillEdit||settings;settingsBeforeBillEdit=null;closeModal();await refresh();toast(`${updated.invoice} updated. Stock and invoice totals are saved.`);showReceipt(updated)};tx.onabort=()=>{if(failure)toast(failure,true);else toast(tx.error?.message||'The invoice could not be updated. No changes were saved.',true)};tx.onerror=()=>{}}
  function addToCart(productId){const p=products.find(x=>x.id===productId);if(!p)return;const found=cart.find(x=>x.id===p.id);if(editingSaleId){const maximum=Number(p.stock||0)+originalBillQuantity(p.id);if(Number(found?.quantity||0)+1>maximum+0.0001){toast(`Only ${Math.max(0,maximum-Number(found?.quantity||0))} ${p.unit||'unit'} can be added to this edited bill.`,true);return}if(found)found.quantity=Number((found.quantity+1).toFixed(2));else cart.push({id:p.id,name:p.name,barcode:p.barcode||'',hsnCode:p.hsnCode||'',gstRate:Number(p.gstRate??settings.taxRate)||0,unit:p.unit||'item',price:Number(p.price),quantity:1});render();setTimeout(()=>$('#scanInput')?.focus(),0);return}if(Number(p.stock)<=0){toast('This product is out of stock.',true);return}if(found){if(found.quantity+1>Number(p.stock)){toast(`Only ${p.stock} ${p.unit||'unit'} in stock.`,true);return}found.quantity=Number((found.quantity+1).toFixed(2))}else cart.push({id:p.id,name:p.name,barcode:p.barcode,hsnCode:p.hsnCode||'',gstRate:Number(p.gstRate??settings.taxRate)||0,unit:p.unit||'item',price:Number(p.price),quantity:1});render();setTimeout(()=>$('#scanInput')?.focus(),0)}
  function updateEditBillPrice(index,value){const price=Number(value);if(!cart[index]||!Number.isFinite(price)||price<0){toast('Enter a valid item price.',true);render();return}cart[index].price=roundMoney(price);render()}
  document.addEventListener('click',e=>{const edit=e.target.closest('[data-edit-sale]');if(edit){e.preventDefault();e.stopImmediatePropagation();beginBillEdit(edit.dataset.editSale);return}const action=e.target.closest('[data-action]')?.dataset.action;if(editingSaleId&&action==='checkout'){e.preventDefault();e.stopImmediatePropagation();showEditBillConfirm();return}if(editingSaleId&&action==='cancel-edit-bill'){e.preventDefault();e.stopImmediatePropagation();cancelBillEdit(true);return}if(editingSaleId&&e.target.closest('[data-qty]')){const b=e.target.closest('[data-qty]'),i=Number(b.dataset.qty),delta=Number(b.dataset.delta||0),line=cart[i],p=products.find(x=>x.id===line?.id);if(delta>0&&p&&Number(line.quantity)+delta>Number(p.stock||0)+originalBillQuantity(p.id)+0.0001){e.preventDefault();e.stopImmediatePropagation();toast(`Only ${Math.max(0,Number(p.stock||0)+originalBillQuantity(p.id)-Number(line.quantity))} ${p.unit||'unit'} can be added.`,true)}}},true);
  document.addEventListener('change',e=>{const price=e.target.closest('[data-edit-price]');if(price&&editingSaleId){e.stopImmediatePropagation();updateEditBillPrice(Number(price.dataset.editPrice),price.value);return}const qty=e.target.closest('[data-qty-input]');if(qty&&editingSaleId){const index=Number(qty.dataset.qtyInput),line=cart[index],product=products.find(p=>p.id===line?.id),value=Number(qty.value),maximum=product?Number(product.stock||0)+originalBillQuantity(product.id):0;if(!Number.isFinite(value)||value<=0||value>maximum+0.0001){e.stopImmediatePropagation();toast(`Quantity must be above zero and no more than ${maximum}.`,true);render()}}},true);
  document.addEventListener('keydown',e=>{if(editingSaleId&&e.key==='F9'){e.preventDefault();e.stopImmediatePropagation();showEditBillConfirm();return}if(e.ctrlKey&&e.key==='Enter'&&$('#editBillForm')){e.preventDefault();e.stopImmediatePropagation();$('#editBillForm').requestSubmit()}});
